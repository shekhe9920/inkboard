AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HealthFunction
      Handler: healthHandler.handler
      Runtime: nodejs22.x
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/features/health/healthHandler.ts
        Minify: false
        Sourcemap: true
        Target: es2022
      SamResourceId: HealthFunction
