AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HealthFunction
      Handler: healthHandler.handler
      Runtime: nodejs22.x
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
      Environment:
        Variables:
          NODE_OPTIONS: ' --enable-source-maps'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/features/health/healthHandler.ts
        Minify: false
        Sourcemap: true
        Target: es2022
      SamResourceId: HealthFunction
  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateNoteFunction
      Handler: createNoteHandler.createNoteHandler
      Runtime: nodejs22.x
      Environment:
        Variables:
          NOTES_TABLE_NAME:
            Ref: NotesTable
          DYNAMODB_ENDPOINT: ''
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: NotesTable
      Events:
        CreateNoteApi:
          Type: Api
          Properties:
            Path: /notes
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/features/notes/handlers/createNoteHandler.ts
        Minify: false
        Sourcemap: true
        Target: es2022
      SamResourceId: CreateNoteFunction
  GetNoteByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetNoteByIdFunction
      Handler: getNoteByIdHandler.getNoteByIdHandler
      Runtime: nodejs22.x
      Environment:
        Variables:
          NOTES_TABLE_NAME:
            Ref: NotesTable
          DYNAMODB_ENDPOINT: ''
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: NotesTable
      Events:
        GetNoteByIdApi:
          Type: Api
          Properties:
            Path: /notes/{id}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/features/notes/handlers/getNoteByIdHandler.ts
        Minify: false
        Sourcemap: true
        Target: es2022
      SamResourceId: GetNoteByIdFunction
  GetAllNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetAllNotesFunction
      Handler: getAllNotesHandler.getAllNotesHandler
      Runtime: nodejs22.x
      Environment:
        Variables:
          NOTES_TABLE_NAME:
            Ref: NotesTable
          DYNAMODB_ENDPOINT: ''
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: NotesTable
      Events:
        GetAllNotesApi:
          Type: Api
          Properties:
            Path: /notes
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/features/notes/handlers/getAllNotesHandler.ts
        Minify: false
        Sourcemap: true
        Target: es2022
      SamResourceId: GetAllNotesFunction
  UpdateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: UpdateNoteFunction
      Handler: updateNoteHandler.updateNoteHandler
      Runtime: nodejs22.x
      Environment:
        Variables:
          NOTES_TABLE_NAME:
            Ref: NotesTable
          DYNAMODB_ENDPOINT: ''
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: NotesTable
      Events:
        CreateNoteApi:
          Type: Api
          Properties:
            Path: /notes/{id}
            Method: patch
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/features/notes/handlers/updateNoteHandler.ts
        Minify: false
        Sourcemap: true
        Target: es2022
      SamResourceId: UpdateNoteFunction
  DeleteNoteByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DeleteNoteByIdFunction
      Handler: deleteNoteByIdHandler.deleteNoteByIdHandler
      Runtime: nodejs22.x
      Environment:
        Variables:
          NOTES_TABLE_NAME:
            Ref: NotesTable
          DYNAMODB_ENDPOINT: ''
          NODE_OPTIONS: ' --enable-source-maps'
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: NotesTable
      Events:
        DeleteNoteByIdApi:
          Type: Api
          Properties:
            Path: /notes/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/features/notes/handlers/deleteNoteByIdHandler.ts
        Minify: false
        Sourcemap: true
        Target: es2022
      SamResourceId: DeleteNoteByIdFunction
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: inkboard-notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
